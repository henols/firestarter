# Firestarter protocol capability table (canonical source — meta-repo authoritative)
#
# One row per protocol_id the firmware has a handler for. The firmware dispatches
# on these ids; the database generator may mark a chip "supported" only when its
# protocol_id has a row here. A row is blocked only for what the hardware cannot do.
#
# Generation happens in the meta repo only. tools/protocol/sync_to_subrepos.sh
# writes:
#   firestarter_fw/include/protocol_caps.h
#   firestarter_app/firestarter/protocol_caps.py
#
# Edit ONLY this file. Never edit a generated artifact by hand.
#
# vpp_route  where the firmware puts the programming rail for this handler:
#              "none"    no high-voltage rail
#              "oe_vpp"  on the OE/VPP socket pin
#              "a9"      on the A9 pin
#              "pin1"    on socket pin 1 (a chip whose pin 1 is an address or
#                        data line must not use a handler with this route)
# command_set  the chip command set the handler speaks (documentation, checked
#              for non-empty only)

[[protocols]]
protocol = 0x05
name = "PROTO_FLASH_5V_PAGE"
command_set = "amd_5v_page"
vpp_route = "none"

[[protocols]]
protocol = 0x06
name = "PROTO_FLASH_NOR_UNLOCK"
command_set = "amd_unlock"
vpp_route = "none"

[[protocols]]
