; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Phase 20 E2E-04: `pio run` (the firmware build) MUST NOT attempt to link the
; [env:native] target — it is a test-only environment with no main(), so
; linking fails with "undefined reference to main". Constrain default_envs
; to the AVR targets; `pio test -e native` still picks up native explicitly.
default_envs = uno, uno328pb, leonardo

[env]
monitor_speed = 250000

build_flags = 
	-D MONITOR_SPEED=${env.monitor_speed}
	-D HARDWARE_REVISION
	; -D SERIAL_DEBUG
	; -D DEBUG_ADDRESS
	-D DEV_TOOLS
	; -D EXTRA_INFO_LOGGING
	
extra_scripts =
	pre:name_firmware.py
	pre:zero_bootloader_reserve.py

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	-D SERIAL_ON_IO
; Quick task 260820-a7w: report the ATmega328P's real 32768 B flash size
; instead of the board JSON's optiboot-reduced 32256 B. Forfeits: 512 B
; (optiboot), which the linker no longer protects -- optiboot itself is
; untouched on the physical chip, but the build no longer refuses to link
; firmware that grows into its region. Operator-accepted (T-a7w-02).
board_upload.maximum_size = 32768

[env:uno328pb]
; Phase 21 / Plan 21-02: third firmware target — Arduino-Uno-shaped board
; carrying an ATmega328PB MCU. platform = atmelavr (mirror of [env:uno]);
; the bundled boards/ATmega328PB.json ships with build.core = "MiniCore"
; and -DARDUINO_AVR_ATmega328PB via build.extra_flags, so the four widened
; ARDUINO_AVR_UNO guards (uno_rurp_shield.cpp:8, rurp_common.cpp:10+23,
; rurp_register_utils.h:63) now fire on this env. RURP_BOARD_NAME is the
; literal "uno328pb" (NOT \"${this.board}\" — which would resolve to
; ATmega328PB and break the board-id triple per CONTEXT D-07).
platform = atmelavr
board = ATmega328PB
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"uno328pb\"
	-D SERIAL_ON_IO
; Quick task 260820-a7w: report the ATmega328PB's real 32768 B flash size.
; ATmega328PB.json already sets upload.maximum_size = 32768, so this line
; is set for uniform intent across all three envs and to stop a future
; board-JSON change from silently moving this target alone -- but on its
; own it does NOT change the reported ceiling here, because build.core =
; "MiniCore" makes the atmelavr builder subtract a bootloader reserve from
; this value AFTER the override is applied (see zero_bootloader_reserve.py,
; wired above, which is the mechanism that actually zeroes that
; subtraction). Forfeits: 384 B (the urclock bootloader the MiniCore
; builder subtracts by default), no longer protected by the linker.
; Operator-accepted (T-a7w-02).
board_upload.maximum_size = 32768

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
build_flags =
	${env.build_flags}
	-D RURP_BOARD_NAME=\"${this.board}\"
	; Leonardo (ATmega32u4, 2.5KB SRAM) uses the full 1K data buffer. The host reads
	; DATA_BUFFER_SIZE from the FW identity string and sizes host->fw chunks to 1022
	; (1024-2: CRC8 + decoder NUL slot). Phase 53 / #transport-protocol-verify.
	-D DATA_BUFFER_SIZE=1024
; Quick task 260820-a7w: report the ATmega32U4's real 32768 B flash size
; instead of the board JSON's Caterina-reduced 28672 B. Forfeits: 4096 B
; (Caterina, the USB bootloader). Consequence, stated plainly as the trade
; the operator accepted: the linker no longer protects the top 4096 B, so
; firmware that grows past 28672 B will be linked into and flashed over
; Caterina, bricking USB bootloader entry on this board. There is
; deliberately no compensating guard (T-a7w-01).
board_upload.maximum_size = 32768

[env:native]
platform = native
test_framework = unity
; KNOWN-FLAKY: test_flash_intel_vpp suite has all individual Unity assertions
; PASS but the suite as a whole ERRORS (Unity teardown abort, pre-existing
; parallel-build filesystem race).
; Documented in Phase 17 code review WR-01 + Phase 20 verification (2026-05-20).
; Tracked as carry-forward debt in v1.4 MILESTONES.md "Known Gaps".
; TODO(v1.5): root-cause the SIGABRT in Unity teardown and re-enable.
; test_eeprom28c_chip_id (the other historical KNOWN-FLAKY half named here)
; was MIGRATED in v1.22 Phase 116 (TRACE-04, D-12): its outcome-independent
; identity-gate assertions moved onto test_sdp_harness's address-keyed mock
; (always-green, runs today); its SDP-outcome-dependent assertions
; (matching_chip_id_proceeds, mismatching_chip_id_with_force_warns) are
; parked in plan 116-06's RED test_eeprom28c_sdp suite pending the Phase 117
; fix. The old test_eeprom28c_chip_id/ directory no longer exists — the
; Unity-teardown SIGABRT root cause (D-13) stays deferred, unattempted.
; Using positive test_filter allowlist (test_ignore was being honored
; inconsistently — likely PIO version quirk).
;
; ENABLED (v1.22 Phase 117, D-03 commit 1): native/avr/test_eeprom28c_sdp is
; now in this test_filter allowlist and runs under `pio test -e native`. It
; is RED at this commit against the still-unfixed production tree; the
; verbatim capture lives in
; test/native/avr/test_eeprom28c_sdp/RED-BASELINE.md under the heading
; "## Post-suite-edit RED baseline (Phase 117 commit 1 — D-03)". Phase 116's
; D-01 claimed adding this one line would itself be the whole RED-to-GREEN
; proof; that did not hold (117-CONTEXT.md D-01/D-02/D-03 supersede it) —
; the flip required four edits: this line, un-mocking `set_data` in the
; suite, flipping five response-code assertions, and one new regression
; case. Plan 117-02 lands the production fix that flips this suite GREEN.
; Never use TEST_IGNORE_MESSAGE here (an IGNORED result does not
; demonstrate RED).
test_filter =
	native/avr/test_dispatch
	native/avr/test_not_implemented
	native/avr/test_messages
	native/avr/test_data_input
	native/avr/test_read_timing
	native/avr/test_cobs_data_frame
	native/avr/test_cobs_cmd_frame
	native/avr/test_frame_vectors
	native/avr/test_val_eprom
	native/avr/test_val_eeprom28c
	native/avr/test_val_nor_unlock
	native/avr/test_val_5v_page
	native/avr/test_val_flash_intel
	native/avr/test_val_sram
	native/avr/test_sdp_harness
	native/avr/test_eeprom28c_sdp
	native/avr/test_cmd_admission
build_flags =
	${env.build_flags}
	-std=gnu++17
	-I include
	-I test/native/avr/test_dispatch
	-I test/native/avr/test_not_implemented
	-I test/native/avr/test_messages
	-I test/native/avr/test_data_input
	-I test/native/avr/test_read_timing
	-I test/native/avr/test_cobs_data_frame
	-I test/native/avr/test_cobs_cmd_frame
	-I test/native/avr/test_frame_vectors
	-I test/native/avr/test_val_eprom
	-I test/native/avr/test_val_eeprom28c
	-I test/native/avr/test_val_nor_unlock
	-I test/native/avr/test_val_5v_page
	-I test/native/avr/test_val_flash_intel
	-I test/native/avr/test_val_sram
	-I test/native/avr/test_sdp_harness
	-I test/native/avr/test_eeprom28c_sdp
	-I test/native/avr/test_cmd_admission
	-D RURP_BOARD_NAME=\"native\"
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
; Phase 12 Wave 1: pull in ONLY src/proms/*.cpp from the firmware tree so
; configure_memory() and the configure_*() handlers link into the host
; test binary. AVR-only sources (src/boards/*.cpp, src/dev_tools.cpp,
; src/eprom_operations.cpp, src/logging.c) are excluded; their rurp_log
; / rurp_* / PROGMEM-string symbols are stubbed by
; test/native/avr/test_dispatch/host_stubs.cpp (auto-discovered by PIO
; under test/).
; Phase 6: include rurp_serial_utils.cpp for test_messages suite.
; (messages.c was generated as a 256-byte PROGMEM param-byte-count table
; but had no firmware callers; deleted post-Phase-7 to reclaim ~256 B of
; Leonardo flash. The test suite no longer needs to include it.)
; Phase 44 Plan 02: include json_parser.c for test_read_timing suite
; (json_parse / json_init are called directly by the read-timing knob tests).
; v1.22 Phase 119 D-06/D-07 (119-07 Task 1, RESEARCH Open Question 1, option a):
; include operation_utils.cpp so op_execute_stateful_operation's NULL-main
; refusal (LOCK-04/DEVTEST-01's op-layer guard) and D-08's cmd x protocol
; matrix are machine-checked by test_dispatch/test_configure_memory.cpp and
; test_eeprom28c_sdp/test_eeprom28c_sdp.cpp rather than reasoned about in
; prose. Must stay in lockstep with [env:native_nodevtools] below.
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_nodevtools]
; v1.22 Phase 119 D-04's second native env (119-02).
;
; -D DEV_TOOLS lives in the shared [env] block above (:26) and is inherited
; by all three AVR envs AND by [env:native] -- so a build without it had
; never been compiled or tested before this milestone. This env exists so
; that LOCK-03's "is_memory_cmd() behaves identically with or without
; -D DEV_TOOLS" claim is a SEMANTIC proof (the same source, actually
; compiled and run, twice) rather than a merely TEXTUAL one (a human or a
; grep asserting the predicate's body looks conditional-free). Plan 119-03's
; source-scan gate is the third oracle; this env is the second.
;
; It discharges item 4 ONLY of the folded todo
; .planning/todos/prove-pio-dev-flag-fails-closed.md ("pio test passes with
; DEV_TOOLS absent") as a by-product of proving LOCK-03. Items 1 through 3
; of that todo (the sysenv fail-open/fail-closed matrix and avr-nm symbol
; capture) belong to backlog 999.15 / gh#8 and are NOT attempted here.
;
; Three deliberate differences from [env:native] above, everything else is
; identical:
;   1. build_flags does NOT start with ${env.build_flags} -- it spells out
;      -D MONITOR_SPEED=250000 and -D HARDWARE_REVISION explicitly and
;      OMITS -D DEV_TOOLS. -D HARDWARE_REVISION is load-bearing, not
;      incidental: test/native/avr/_shared/host_stubs_common.inc:208-224
;      gates four hardware-revision stubs on it, and dropping it would
;      change which stubs compile and break the SDP suites.
;   2. test_filter and the -I list are each the FULL 17-entry list from
;      [env:native], not a subset -- RESEARCH measured zero test-porting
;      cost (no test file references DEV_TOOLS or CMD_DEV_* anywhere) for
;      ~52s of extra cold-build CI time, in exchange for DEV_TOOLS-invariance
;      coverage across the full 17-entry list rather than just the new
;      truth table. (Phase 124 Plan 08: corrected from a stale, undercounted
;      pair of comments -- [env:native]'s test_filter has always had 17
;      entries, not 16; this is the deferred fold-in CONTEXT licensed "only
;      if a plan arises", not new scope.)
;   3. NOT added to default_envs (:16) -- pio run would try to link a
;      main()-less target ("undefined reference to main"), the exact
;      failure default_envs exists to prevent.
platform = native
test_framework = unity
test_filter =
	native/avr/test_dispatch
	native/avr/test_not_implemented
	native/avr/test_messages
	native/avr/test_data_input
	native/avr/test_read_timing
	native/avr/test_cobs_data_frame
	native/avr/test_cobs_cmd_frame
	native/avr/test_frame_vectors
	native/avr/test_val_eprom
	native/avr/test_val_eeprom28c
	native/avr/test_val_nor_unlock
	native/avr/test_val_5v_page
	native/avr/test_val_flash_intel
	native/avr/test_val_sram
	native/avr/test_sdp_harness
	native/avr/test_eeprom28c_sdp
	native/avr/test_cmd_admission
build_flags =
	-D MONITOR_SPEED=250000
	-D HARDWARE_REVISION
	-std=gnu++17
	-I include
	-I test/native/avr/test_dispatch
	-I test/native/avr/test_not_implemented
	-I test/native/avr/test_messages
	-I test/native/avr/test_data_input
	-I test/native/avr/test_read_timing
	-I test/native/avr/test_cobs_data_frame
	-I test/native/avr/test_cobs_cmd_frame
	-I test/native/avr/test_frame_vectors
	-I test/native/avr/test_val_eprom
	-I test/native/avr/test_val_eeprom28c
	-I test/native/avr/test_val_nor_unlock
	-I test/native/avr/test_val_5v_page
	-I test/native/avr/test_val_flash_intel
	-I test/native/avr/test_val_sram
	-I test/native/avr/test_sdp_harness
	-I test/native/avr/test_eeprom28c_sdp
	-I test/native/avr/test_cmd_admission
	-D RURP_BOARD_NAME=\"native\"
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
; v1.22 Phase 119 D-06/D-07 (119-07 Task 1): kept in lockstep with
; [env:native] above -- both envs must compile the identical set of
; production TUs, or DEV_TOOLS-invariance stops covering the op layer.
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_pinmap_provisional]
; Phase 124 Plan 08 (MERGE-04, D-11): a THIRD native environment, whose sole
; purpose is to compile src/proms/memory.cpp with RURP_PINMAP_PROVISIONAL=1
; so a native test can prove configure_memory() actually refuses the eight
; is_memory_cmd() commands under a provisional pin map.
;
; WHY A THIRD ENV, NOT A #define AT THE TOP OF A TEST FILE. PlatformIO
; build_flags are ENVIRONMENT-scoped, and build_src_filter compiles
; src/proms/memory.cpp ONCE per environment -- a #define written at the top
; of a test .cpp cannot retroactively change how the shared object file for
; that environment was already compiled. The only way to exercise
; configure_memory() built WITH the flag set is a dedicated environment
; whose build_flags carry it.
;
; HARD CONSTRAINT -- MUST NEVER be folded into [env:native] or
; [env:native_nodevtools]'s test_filter. Both of those are pinned at
; exactly the same 17-entry test_filter list (see the corrected comment
; above) and MERGE-06 asserts 141 cases / 17 suites on BOTH of them by
; exact count. This env's test_filter therefore names ONLY its own new
; suite (1 entry, not 18), and this env is NOT added to default_envs
; (:16) -- pio run would try to link a main()-less target.
;
; Also do not feed "native_pinmap_provisional" to check_build_warnings.py
; until Plan 124-10 adds it to the baseline's warnings block -- an unknown
; env name is exit 2 there today.
platform = native
test_framework = unity
test_filter =
	native/avr/test_pinmap_provisional
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_pinmap_provisional
	-D RURP_PINMAP_PROVISIONAL=1
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_trace_v131]
; Phase 138 Plan 03 (PREP-03, D-01/D-02/D-04): a FOURTH native environment,
; whose sole purpose is to compile+run test_trace_eprom_v131 -- the suite
; that captures the pre-change 27C write loop's merged strobe+timing stream
; for all three protocols (0x07/0x08/0x0B), before any v1.31 code moves.
;
; HARD CONSTRAINT -- MUST NEVER be folded into [env:native] or
; [env:native_nodevtools]'s test_filter. Both of those are pinned at exactly
; the same 17-entry test_filter list and a live gate (check_size_baseline.py's
; compare_native) asserts 141 cases / 17 suites on BOTH of them by exact
; count. This env's test_filter therefore names ONLY its own new suite (1
; entry, not 18), and this env is NOT added to default_envs (:16) -- pio run
; would try to link a main()-less target ("undefined reference to main").
;
; FURTHER CAVEAT (measured, Phase 138 Plan 03 RESEARCH): do not feed
; "native_trace_v131" to either live gate.
;   - check_size_baseline.py hardcodes NATIVE_ENVS = ("native",
;     "native_nodevtools") and compare_native does a bare
;     baseline["native_envs"][env] lookup -- an unknown env name raises an
;     UNCAUGHT KeyError (exit 1, a false regression signal), not the
;     documented exit-2 "tool/format failure". Recorded as finding F-138-05
;     (owner henols), not fixed here.
;   - check_build_warnings.py handles this correctly (exit 2, clean message)
;     but there is still no baseline entry for this env to compare against.
; This env's own counts and warnings are recorded ONLY in the new
; scripts/baseline/size_baseline_v131.json, never asserted by either gate.
platform = native
test_framework = unity
test_filter =
	native/avr/test_trace_eprom_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_trace_eprom_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_params_v131]
; Phase 140 Plan 04 (TABLE-03, TABLE-01, D-11): a FIFTH native environment,
; whose sole purpose is to compile+run test_eprom_params_v131 -- the suite
; that exercises the pulse_delay == 0 fallback in configure_eprom
; (src/proms/eprom.cpp:69-76) for protocols 0x07/0x08/0x0B, and proves
; eprom_params_for()'s row resolution (plan 140-01) behaviourally. 0 of the
; 329 shipped 27C chips yield pulse_delay == 0 (F-140-04), so this native
; suite is the ONLY possible oracle for TABLE-03 -- no bench run in Phase 145
; can reach this branch.
;
; HARD CONSTRAINT -- MUST NEVER be folded into [env:native] or
; [env:native_nodevtools]'s test_filter. Both of those are pinned at exactly
; the same 17-entry test_filter list and a live gate (check_size_baseline.py's
; compare_native) asserts 141 cases / 17 suites on BOTH of them by exact
; count. This env's test_filter therefore names ONLY its own new suite (1
; entry, not 18), and this env is NOT added to default_envs (:16) -- pio run
; would try to link a main()-less target ("undefined reference to main").
;
; FURTHER CAVEAT (measured, F-138-05): do not feed "native_params_v131" to
; either live gate -- check_size_baseline.py hardcodes NATIVE_ENVS =
; ("native", "native_nodevtools") and an unknown env name raises an
; UNCAUGHT KeyError (exit 1, a false regression signal, not the documented
; exit-2); check_build_warnings.py handles it cleanly (exit 2) but has no
; baseline entry for this env either way. This env's own counts are recorded
; ONLY in this plan's SUMMARY and the phase record, never asserted by either
; gate.
;
; NO CI COVERAGE (F-140-11, D-11): neither build.yml nor beta-build.yml runs
; any `pio test` env beyond native and native_nodevtools -- this env's counts
; are a LOCAL, run-by-name obligation. Never imply CI covers it.
platform = native
test_framework = unity
test_filter =
	native/avr/test_eprom_params_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_eprom_params_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes

[env:native_loop_v131]
; Phase 141 Plan 03 (LOOP-01..LOOP-08, D-10): a SIXTH native environment,
; whose sole purpose is to compile+run test_loop_eprom_v131 -- the suite
; that verifies the per-byte pulse-to-verify loop (plans 141-04/141-07/
; 141-08 land the loop itself; this env just runs the suite against it).
; The frozen native_trace_v131 fixture CANNOT verify that loop: Phase 141's
; D-10 lets it go RED by design (a fixture re-frozen by the phase that
; breaks it stops being evidence), so this phase authors its own oracle
; instead, on this file's native_params_v131 precedent immediately above.
;
; HARD CONSTRAINT -- MUST NEVER be folded into [env:native] or
; [env:native_nodevtools]'s test_filter. Both of those are pinned at exactly
; the same 17-entry test_filter list and a live gate (check_size_baseline.py's
; compare_native) asserts 141 cases / 17 suites on BOTH of them by exact
; count. This env's test_filter therefore names ONLY its own new suite (1
; entry, not 18), and this env is NOT added to default_envs (:16) -- pio run
; would try to link a main()-less target ("undefined reference to main").
;
; FURTHER CAVEAT (measured, F-138-05, same mechanism as native_params_v131
; above): do not feed "native_loop_v131" to either live gate --
; check_size_baseline.py hardcodes NATIVE_ENVS = ("native",
; "native_nodevtools") and an unknown env name raises an UNCAUGHT KeyError
; (exit 1, a false regression signal, not the documented exit-2);
; check_build_warnings.py handles it cleanly (exit 2) but has no baseline
; entry for this env either way. This env's own counts are recorded ONLY in
; this plan's SUMMARY and the phase record, never asserted by either gate.
;
; NO CI COVERAGE: neither build.yml nor beta-build.yml runs any `pio test`
; env beyond native and native_nodevtools -- this env's counts are a LOCAL,
; run-by-name obligation, recorded in the Phase 141 phase record. Never
; imply CI covers it.
;
; PHASE 142 ADDENDUM (VPP-01..VPP-04, D-14): this env now runs a SECOND
; suite, test_vpp_eprom_v131 -- the VPP-04 gate this phase authors for the
; EPROM write/init VPP-validation path (native_loop_v131 is reused rather
; than creating a seventh env). It exists for the same reason
; native_loop_v131 itself does: native and native_nodevtools are pinned at
; exactly 141 cases / 17 suites / all_passed by check_size_baseline.py's
; compare_native, so adding a case to either would turn a live gate RED.
; Every caveat above -- NO CI COVERAGE, never feed this env's name to
; check_size_baseline.py or check_build_warnings.py -- applies unchanged to
; the new suite.
platform = native
test_framework = unity
test_filter =
	native/avr/test_loop_eprom_v131
	native/avr/test_vpp_eprom_v131
build_flags =
	${env:native.build_flags}
	-I test/native/avr/test_loop_eprom_v131
	-I test/native/avr/test_vpp_eprom_v131
lib_deps =
	fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter = +<proms/> +<boards/rurp_serial_utils.cpp> +<json_parser.c> +<operation_utils.cpp>
test_build_src = yes
