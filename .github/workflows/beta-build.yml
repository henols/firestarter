name: Firestarter beta pre-release build
on:
  push:
    branches:
    - beta
    paths-ignore:
    - '**.md'
    - '**.sh'
    - '.gitignore'
    - 'docs/**'
    - 'documents/**'
    - 'images/**'
    - '.vscode/**'
    - '.editorconfig/**'
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Explicit PEP 440 pre-release version (e.g. 3.1.0b1). Leave blank for auto-increment via git-tag scan.'
        required: false
        type: string
      # D-01/D-03: permanent rehearsal input (not scaffolding). Deleting it at
      # milestone close would leave the next person to change this job with
      # no way to rehearse, and they would test on `beta` instead (128-CONTEXT
      # D-03). Typed `boolean` (Security V5): a string-typed input could carry
      # an arbitrary value into `draft:` and `tag_name:` in Plan 128-07.
      rehearsal:
        description: 'Rehearsal mode: publish a DRAFT release under a rehearsal-<run_id> tag instead of a real pre-release. Leave false for a real beta cut.'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # D-01 (permanent, not scaffolding) / A1: `workflow_dispatch` inputs are
      # absent on a `push` event, so `inputs.rehearsal` resolves to an empty
      # string on every real `beta` push -- a `draft: true` leaking onto that
      # push would silently stop publishing real betas. This step resolves
      # the value exactly once and echoes it to $GITHUB_STEP_SUMMARY on every
      # run so a `beta` push visibly shows it resolve to `false`, rather than
      # leaving a reader to reason about the expression at each use site.
      # Confirmed by observation on rehearsal run A (Plan 128-10).
      - name: Resolve rehearsal mode
        id: mode
        env:
          REHEARSAL_INPUT: ${{ inputs.rehearsal }}
        run: |
          if [ "$REHEARSAL_INPUT" = "true" ]; then
            REHEARSAL=true
          else
            REHEARSAL=false
          fi
          echo "rehearsal=${REHEARSAL}" >> "$GITHUB_OUTPUT"
          echo "Resolved rehearsal mode: ${REHEARSAL}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Set up Python 3.11 for codegen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Catalog validity check
        run: python3 tools/catalog/codegen.py --catalog tools/catalog/messages.toml --check

      - name: Codegen drift gate (messages.h)
        run: |
          python3 tools/catalog/codegen.py \
            --catalog tools/catalog/messages.toml \
            --target include/messages.h \
            --language cpp
          git diff --exit-code include/messages.h

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

      - name: Install pytest for script tests
        run: pip install pytest

      - name: Run update_version.py tests
        run: pytest tests/ -v

      - name: Generate release version
        id: version
        env:
          BETA_VERSION: ${{ github.event.inputs.beta_version }}
        run: .github/scripts/update_version.py

      - uses: stefanzweifel/git-auto-commit-action@v5

      - name: Build PlatformIO Project
        run: pio run

      - name: Resolve release target SHA
        id: release_target
        run: |
          # Phase 20 E2E-03 (firmware mirror): pin the tag to the post-auto-
          # commit HEAD so the Pre-release points at the version-bumped
          # commit, not the trigger commit.
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release target SHA: $SHA"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/**/firestarter_*.hex
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.release_target.outputs.sha }}
          prerelease: true
          make_latest: false
        env:
          # Phase 20 E2E-05: PERSONAL_ACCESS_TOKEN is not configured on the
          # firmware repo. Unlike the app, the firmware Release has no
          # downstream workflow that needs `release.published` to cascade
          # (no PyPI publish step), so the built-in GITHUB_TOKEN is
          # sufficient and avoids requiring a PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
