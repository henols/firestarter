name: PY32F071 firmware

# Validation build for the native PY32F071 target. It publishes ONE thing: the
# firmware image needed to install onto a board. ELF, linker map, size report,
# checksums and build logs are deliberately not uploaded anywhere — they are
# reproducible in a dev environment with the same two cmake commands used below,
# and nothing downstream consumes them.
#
# This workflow does NOT cut releases. Release assets come from beta-build.yml,
# alongside the AVR targets, because the version bump
# (.github/scripts/update_version.py rewrites include/version.h and
# auto-commits) happens inside that job. An image built in any other job would
# carry a stale VERSION string — and the host's entire update decision is a
# comparison of that string against the release tag.
#
# Integration into beta-build.yml is three steps plus one release line; see
# platform/py32f071/README.md § "Release integration".

on:
  pull_request:
    paths:
      - "platform/py32f071/**"
      - "include/**"
      - "src/**"
      - "lib/jsmn/**"
      - ".github/workflows/py32f071.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Arm toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Configure
        run: |
          cmake \
            -S platform/py32f071 \
            -B build/py32f071 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/py32f071

      # Size goes to the job log, not to a file: worth seeing on every run,
      # worth nothing as an artifact.
      - name: Report firmware size
        run: arm-none-eabi-size build/py32f071/firestarter_py32f071.elf

      - name: Verify the install image exists and is non-empty
        working-directory: build/py32f071
        run: |
          set -euxo pipefail
          test -s firestarter_py32f071.hex

      # The only publishable output. Named firestarter_py32f071.hex to match the
      # asset name the host installer resolves (`firestarter_<board>.hex`, board
      # = the RURP_BOARD_NAME the firmware reports), so a PR build can be
      # downloaded and flashed directly with:
      #     firestarter fw --install --board py32f071
      # Actions always zips an artifact; a single-file artifact unzips to exactly
      # the image and nothing else.
      - name: Upload firmware install image
        uses: actions/upload-artifact@v4
        with:
          name: firestarter_py32f071
          if-no-files-found: error
          path: build/py32f071/firestarter_py32f071.hex
